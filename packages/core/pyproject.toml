[project]
name = "jobpilot-core"
version = "0.1.0"
description = "Shared config, DB models, LLM provider abstraction and rate limiter"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3",
  "redis[hiredis]>=5.2,<6",
  "httpx>=0.28",
  "httpx2>=2.16",  # the HTTP client used by the openai SDK (v3+)
  "openai>=1.60",
  "cryptography>=44",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot_core"]
