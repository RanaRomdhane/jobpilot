[project]
name = "jobpilot-resume"
version = "0.1.0"
description = "CV upload validation, text + layout extraction, and the deterministic ATS checks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jobpilot-core",
  "jobpilot-security",
  "pymupdf>=1.25",
  "python-docx>=1.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot_resume"]
