[project]
name = "jobpilot-jobs-sources"
version = "0.1.0"
description = "Job source connectors"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jobpilot-core",
  "jobpilot-security",
  "httpx>=0.28",
  "defusedxml>=0.7",
  "selectolax>=0.3.21",
  "protego>=0.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot_jobs_sources"]
