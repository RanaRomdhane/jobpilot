[project]
name = "jobpilot-worker"
version = "0.1.0"
description = "JobPilot background worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jobpilot-core",
  "jobpilot-security",
  "jobpilot-latex",
  "jobpilot-agents",
  "jobpilot-jobs-sources",
  "arq>=0.26",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot_worker"]
