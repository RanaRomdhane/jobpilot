[project]
name = "jobpilot-mcp-gmail"
version = "0.1.0"
description = "Least-privilege Gmail MCP server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jobpilot-core",
  "jobpilot-security",
  "mcp>=1.20",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot_mcp_gmail"]
