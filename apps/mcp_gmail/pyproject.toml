[project]
name = "jobpilot-mcp-gmail"
version = "0.1.0"
description = "Least-privilege Gmail MCP server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jobpilot-core",
  "jobpilot-security",
  "mcp>=2.3",
  "httpx>=0.28",
  "google-auth-oauthlib>=1.2",  # consent flow only (make gmail-auth)
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot_mcp_gmail"]
