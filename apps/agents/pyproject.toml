[project]
name = "jobpilot-agents"
version = "0.1.0"
description = "Agent definitions, prompts and guardrails"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jobpilot-core",
  "jobpilot-security",
  "openai-agents>=0.24",
  "jobpilot-resume",
  "jobpilot-mcp-gmail",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot_agents"]
