name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jobpilot
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U jobpilot" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: "1"
      TEST_DATABASE_URL: postgresql+asyncpg://jobpilot:jobpilot@127.0.0.1:5433/jobpilot_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      DATABASE_URL: postgresql+asyncpg://jobpilot:jobpilot@127.0.0.1:5433/jobpilot
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes full version tags only (no moving major tag)
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff
        run: |
          uv run ruff check packages apps/api apps/worker apps/mcp_gmail apps/agents scripts tests
          uv run ruff format --check packages apps/api apps/worker apps/mcp_gmail apps/agents scripts tests
      - name: mypy (strict)
        run: uv run mypy packages apps/api apps/worker apps/mcp_gmail apps/agents scripts tests
      - name: migrations apply and match the models
        run: |
          uv run alembic -c packages/core/alembic.ini upgrade head
          uv run alembic -c packages/core/alembic.ini check
          uv run alembic -c packages/core/alembic.ini downgrade base
      - name: pytest
        run: uv run pytest --cov=packages --cov=apps --cov-report=term-missing:skip-covered
      - name: OpenAPI schema is up to date
        run: |
          uv run python -m jobpilot_api.export_openapi > apps/web/openapi.json
          git diff --exit-code apps/web/openapi.json || (echo "::error::run 'make gen-client' and commit" && exit 1)

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jobpilot
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U jobpilot" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: "1"
      DATABASE_URL: postgresql+asyncpg://jobpilot:jobpilot@127.0.0.1:5433/jobpilot
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      # starts the stub LLM and Gmail, the API, the worker and the web app, then runs the journeys
      - name: Playwright journeys
        run: uv run python -m tests.e2e.run_stack
      - name: Keep the report and logs when a journey fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            storage/e2e/logs
          retention-days: 7

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: generated API client is up to date
        run: |
          pnpm gen:api
          git diff --exit-code src/lib/api/schema.ts || (echo "::error::run 'make gen-client' and commit" && exit 1)
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build all images (api/worker share the migrate image)
        run: docker compose -f infra/docker-compose.yml build migrate latex web

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists the PR's commits to scan
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
